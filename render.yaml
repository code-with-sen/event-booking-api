# Render Blueprint: free web service built from the Dockerfile.
# The database is a free Neon Postgres instance; paste its connection string as DATABASE_URL.
services:
  - type: web
    name: event-booking-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
