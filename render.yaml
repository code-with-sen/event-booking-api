# Render Blueprint: free web service built from the Dockerfile.
# The database is a free Neon Postgres instance; paste its connection string as DATABASE_URL.
# The web frontend in /web is deployed as a free static site next to it.
services:
  - type: web
    name: event-booking-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h

  - type: web
    name: event-booking-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Public URL of the API service above, baked in at build time.
      - key: VITE_API_URL
        value: https://event-booking-api-l53d.onrender.com
